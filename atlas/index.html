<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="우크라이나·러시아·유럽·대한민국의 드론과 안티드론(C-UAS) 장비를 검색·비교하고 위협과 대응수단을 연결해 학습하는 공개출처 기반 도감">
<style>
  html{color-scheme:light dark}
  body{margin:0}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>드론·안티드론 학습 도감</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700;900&display=swap">
<style>
/* ══════════════════════════════════════════════════════════════════════════
   군사 연감(reference annual) 조판
     · 흰 지면 위의 활자. 색은 거의 쓰지 않고 강조색 둘만 잉크처럼 사용한다.
     · 위협(드론)=산화철 적, 대응(안티드론)=인쇄 감청. 도감의 구조가 곧 색이다.
     · 괘선·리더점·각주기호로 위계를 만든다. 그림자와 둥근 모서리는 쓰지 않는다.
     · 출처 상충은 연감의 각주 관행 그대로 † 로 표시한다.
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  --desk:#E4E5E1;            /* 책상 바닥 */
  --paper:#FFFFFF;           /* 지면 */
  --paper2:#F6F6F3;          /* 음영 지면 */
  --paper3:#ECECE7;
  --rule:#C8CAC4;            /* 괘선 */
  --rule2:#A8ABA3;
  --ink:#15181B;
  --ink2:#454B50;
  --muted:#7A8087;

  --threat:#8E2B20;          /* 위협 — 산화철 적 */
  --threat-soft:rgba(142,43,32,.07);
  --counter:#1D4D69;         /* 대응 — 인쇄 감청 */
  --counter-soft:rgba(29,77,105,.07);
  --signal:#7A5A00;          /* 주의 */
  --ok:#2A5F3A;
  --violet:#4E3670;

  --accent:var(--counter); --accent-soft:var(--counter-soft);

  --serif:"Noto Serif KR",Georgia,"Times New Roman",serif;
  --sans:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

  --base:14px;               /* 발표 모드에서 커진다 */
  --shadow-float:0 20px 60px rgba(10,14,18,.30);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --desk:#0B0D10; --paper:#14181C; --paper2:#1A1F24; --paper3:#222830;
    --rule:#2C333B; --rule2:#414A54;
    --ink:#E8EAE6; --ink2:#B4BAC0; --muted:#828A92;
    --threat:#E0705E; --threat-soft:rgba(224,112,94,.10);
    --counter:#6FADD0; --counter-soft:rgba(111,173,208,.10);
    --signal:#D6A63C; --ok:#63B57E; --violet:#A38BD6;
    --shadow-float:0 24px 70px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --desk:#0B0D10; --paper:#14181C; --paper2:#1A1F24; --paper3:#222830;
  --rule:#2C333B; --rule2:#414A54;
  --ink:#E8EAE6; --ink2:#B4BAC0; --muted:#828A92;
  --threat:#E0705E; --threat-soft:rgba(224,112,94,.10);
  --counter:#6FADD0; --counter-soft:rgba(111,173,208,.10);
  --signal:#D6A63C; --ok:#63B57E; --violet:#A38BD6;
  --shadow-float:0 24px 70px rgba(0,0,0,.7);
}
/* 발표 모드 — 프로젝터에서 멀리서도 읽히도록 자체와 대비를 키운다 */
:root[data-present="1"]{ --base:19px; --rule:#9DA1A8; --muted:#5C646C; }
:root[data-present="1"][data-theme="dark"],
:root[data-present="1"]:not([data-theme="light"]){ --rule:#4A545F; --muted:#9AA3AB; }

*{box-sizing:border-box}
body{
  margin:0;background:var(--desk);color:var(--ink);font-family:var(--sans);
  font-size:var(--base);line-height:1.6;-webkit-font-smoothing:antialiased
}
a{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent}
a:hover{border-bottom-color:currentColor;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-family:var(--serif);font-weight:700;line-height:1.25;letter-spacing:-.01em;text-wrap:balance}
::selection{background:var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,.stab td:nth-child(2),.cmp td:not(:first-child),.bar-n,.qk b,.stat b,.eq-kv b,.cmprow .v,.srctab td
 {font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ══════════ 상단 ══════════ */
.topbar{position:sticky;top:0;z-index:60;background:var(--paper);border-bottom:2px solid var(--ink)}
.topbar-in{max-width:1500px;margin:0 auto;padding:0 22px;display:flex;align-items:center;gap:18px;height:54px}
.brand{display:flex;align-items:center;gap:9px;cursor:pointer;flex-shrink:0}
.brand-mark{width:26px;height:26px;flex-shrink:0;display:grid;place-items:center;border:1.5px solid var(--ink);position:relative}
.brand-mark::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--threat)}
.brand-mark svg{width:14px;height:14px;stroke:var(--ink);fill:none;stroke-width:2}
.brand-txt{display:flex;flex-direction:column;line-height:1.1}
.brand-txt b{font-family:var(--serif);font-size:14px;font-weight:900;letter-spacing:-.02em}
.brand-txt span{font-family:var(--mono);font-size:8.5px;color:var(--muted);letter-spacing:.13em}

.nav{display:flex;margin-left:6px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{
  padding:17px 12px;color:var(--muted);font-size:12.5px;font-weight:500;white-space:nowrap;
  border-bottom:3px solid transparent;margin-bottom:-2px
}
.nav a:hover{color:var(--ink)}
.nav a.on{color:var(--ink);font-weight:700;border-bottom-color:var(--threat)}

.top-right{margin-left:auto;display:flex;align-items:center;gap:4px;flex-shrink:0}
.iconbtn{
  min-width:28px;height:28px;padding:0 6px;border:1px solid var(--rule2);background:var(--paper);
  display:grid;place-items:center;cursor:pointer;color:var(--ink2);font-family:var(--mono);font-size:10.5px;font-weight:600
}
.iconbtn:hover{background:var(--paper2);border-color:var(--ink2);color:var(--ink)}
.iconbtn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.iconbtn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}
.cmpbadge{position:relative}
.cmpbadge i{position:absolute;top:-6px;right:-6px;background:var(--threat);color:#fff;font-family:var(--mono);
  font-size:9px;font-style:normal;min-width:15px;height:15px;display:grid;place-items:center;font-weight:700;padding:0 3px}
.wrap{max-width:1500px;margin:0 auto;padding:24px 22px 90px}

/* ══════════ 지면 요소 ══════════ */
.card{background:var(--paper);border:1px solid var(--rule)}
.pad{padding:20px}
.sect-h{display:flex;align-items:baseline;gap:12px;margin:0 0 14px;padding-bottom:6px;border-bottom:1.5px solid var(--ink)}
.sect-h h2{font-size:15px;font-weight:700;flex-shrink:0;font-family:var(--serif)}
.sect-h .rule{flex:1}
.sect-h .more{font-family:var(--mono);font-size:10px;color:var(--muted);cursor:pointer;letter-spacing:.06em;flex-shrink:0}
.sect-h .more:hover{color:var(--threat)}
.eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .tiny{font-size:11.5px} .mono{font-family:var(--mono)}
.hr{height:1px;background:var(--rule);margin:16px 0}

.btn{
  border:1px solid var(--rule2);background:var(--paper);color:var(--ink);padding:6px 14px;
  cursor:pointer;font-size:12.5px;font-weight:500;white-space:nowrap
}
.btn:hover{background:var(--paper2);border-color:var(--ink2)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:700}
.btn.primary:hover{background:var(--ink2);color:var(--paper)}
.btn.sm{padding:3px 9px;font-size:11.5px}
.btn.danger{color:var(--threat);border-color:var(--threat)}
.btn:disabled{opacity:.35;cursor:not-allowed}

.chip{
  display:inline-flex;align-items:center;gap:4px;padding:1px 6px;font-size:10.5px;font-weight:500;
  border:1px solid var(--rule2);background:transparent;color:var(--ink2);white-space:nowrap;
  line-height:1.7;font-family:var(--mono);letter-spacing:.02em
}
.chip.k-drone{color:var(--threat);border-color:var(--threat)}
.chip.k-cuas{color:var(--counter);border-color:var(--counter)}
.chip.war{color:var(--threat);border-color:var(--threat);background:var(--threat-soft)}
.chip.unconf{color:var(--violet);border-color:var(--violet)}
.chip x{cursor:pointer;font-style:normal;opacity:.55;font-weight:700}
.chip x:hover{opacity:1}

/* 신뢰도 — 인쇄 도장처럼 */
.conf{
  display:inline-grid;place-items:center;width:17px;height:17px;font-size:10.5px;font-weight:700;
  font-family:var(--mono);flex-shrink:0;border:1.5px solid;background:transparent
}
.conf.A{color:var(--ok);border-color:var(--ok)}
.conf.B{color:var(--counter);border-color:var(--counter)}
.conf.C{color:var(--signal);border-color:var(--signal)}
.conf.D{color:var(--threat);border-color:var(--threat)}
.conf.E{color:var(--muted);border-color:var(--muted)}
.flag{font-size:13px;line-height:1}

.tm{display:inline-flex;gap:2px;align-items:center;vertical-align:middle}
.tm i{width:8px;height:10px;background:var(--rule);display:block}
.tm i.f1{background:var(--ok)} .tm i.f2{background:#5C7A3E} .tm i.f3{background:var(--signal)}
.tm i.f4{background:#A2521C} .tm i.f5{background:var(--threat)}

/* ══════════ 검색 ══════════ */
.searchwrap{position:relative;flex:1;max-width:420px}
.searchbox{width:100%;padding:6px 10px 6px 28px;border:1px solid var(--rule2);background:var(--paper2);font-size:12.5px;outline:none}
.searchbox:focus{border-color:var(--ink);background:var(--paper)}
.searchwrap>svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:13px;height:13px;stroke:var(--muted);fill:none;stroke-width:2;pointer-events:none}
.sugg{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--paper);border:1px solid var(--ink);
  box-shadow:var(--shadow-float);max-height:420px;overflow:auto;z-index:80;padding:3px}
.sugg div{padding:6px 9px;cursor:pointer;font-size:12.5px;display:flex;align-items:center;gap:8px}
.sugg div:hover{background:var(--paper3)}
.sugg .h{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--muted);padding:8px 9px 3px;text-transform:uppercase;cursor:default}
.sugg .h:hover{background:none}

/* ══════════ 표제면 ══════════ */
.masthead{background:var(--paper);border:1px solid var(--rule);border-top:5px solid var(--ink);padding:34px 30px 24px;margin-bottom:20px}
.masthead h1{font-size:clamp(26px,4.2vw,42px);font-weight:900;letter-spacing:-.035em;margin:10px 0 0}
.masthead .sub{color:var(--ink2);font-size:13.5px;max-width:62ch;margin:14px 0 0;line-height:1.75}
/* 판권란 */
.dateline{display:flex;flex-wrap:wrap;margin-top:22px;border-top:1.5px solid var(--ink);border-bottom:1px solid var(--rule)}
.dateline div{padding:12px 22px 12px 0;margin-right:22px;border-right:1px solid var(--rule);flex:0 0 auto}
.dateline div:last-child{border-right:none;margin-right:0}
.dateline b{display:block;font-family:var(--serif);font-size:22px;font-weight:900;letter-spacing:-.03em;line-height:1.1}
.dateline span{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.dateline b.warn{color:var(--threat)}

.bigsearch{margin-top:24px;position:relative;max-width:640px}
.bigsearch input{width:100%;padding:12px 14px 12px 38px;border:1.5px solid var(--ink);background:var(--paper);font-size:14px;outline:none}
.bigsearch input:focus{background:var(--paper2)}
.bigsearch>svg{position:absolute;left:13px;top:14px;width:16px;height:16px;stroke:var(--ink2);fill:none;stroke-width:2}
.exq{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px}
.exq button{border:1px solid var(--rule);background:transparent;color:var(--muted);padding:3px 9px;font-size:11px;cursor:pointer;font-family:var(--mono)}
.exq button:hover{border-color:var(--threat);color:var(--threat)}

/* ══════════ 격자 ══════════ */
.g{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g-main{grid-template-columns:minmax(0,2.15fr) minmax(0,1fr);align-items:start}
@media(max-width:1140px){.g3,.g4{grid-template-columns:repeat(2,1fr)}.g-main{grid-template-columns:1fr}}
@media(max-width:680px){.g2,.g3,.g4{grid-template-columns:1fr}}

.bars{display:flex;flex-direction:column}
.bar{display:grid;grid-template-columns:118px 1fr 36px;gap:10px;align-items:center;font-size:12px;cursor:pointer;
  padding:5px 0;border-bottom:1px dotted var(--rule)}
.bar:last-child{border-bottom:none}
.bar:hover .bar-l{color:var(--threat)}
.bar-l{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.bar-t{height:9px;background:transparent;border:1px solid var(--rule);overflow:hidden}
.bar-t i{display:block;height:100%;background:var(--threat)}
.bar-t.t i{background:var(--counter)}
.bar-n{text-align:right;font-family:var(--mono);font-size:11px;color:var(--muted)}

/* ══════════ 도감 항목 ══════════ */
.cat{display:grid;grid-template-columns:236px minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:980px){.cat{grid-template-columns:1fr}.filters{position:static!important;max-height:none!important}}
.filters{position:sticky;top:70px;max-height:calc(100vh - 88px);overflow:auto;padding-right:6px}
.filters::-webkit-scrollbar{width:5px}
.filters::-webkit-scrollbar-thumb{background:var(--rule2)}
.fgroup{border-bottom:1px solid var(--rule);padding:10px 0}
.fgroup:last-child{border-bottom:none}
.fgroup>summary{cursor:pointer;font-size:10.5px;font-weight:700;color:var(--ink);list-style:none;font-family:var(--mono);
  letter-spacing:.13em;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;user-select:none}
.fgroup>summary::-webkit-details-marker{display:none}
.fgroup>summary::after{content:"−";color:var(--muted)}
.fgroup:not([open])>summary::after{content:"+"}
.fbody{padding-top:8px;display:flex;flex-direction:column;max-height:240px;overflow:auto}
.fbody::-webkit-scrollbar{width:4px}
.fbody::-webkit-scrollbar-thumb{background:var(--rule2)}
.fopt{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);cursor:pointer;padding:3px 4px}
.fopt:hover{background:var(--paper3)}
.fopt input{accent-color:var(--threat);margin:0;width:12px;height:12px;flex-shrink:0}
.fopt .n{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--muted)}
.fopt.dis{opacity:.3}
.rng{display:flex;gap:6px;align-items:center;padding-top:6px}
.rng input{width:100%;padding:4px 6px;border:1px solid var(--rule);background:var(--paper2);font-size:11.5px;font-family:var(--mono);outline:none;min-width:0}
.rng input:focus{border-color:var(--ink)}

.resbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;padding-bottom:10px;border-bottom:1.5px solid var(--ink)}
.resbar .cnt{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.06em;flex-shrink:0}
.resbar .cnt em{font-style:normal;color:var(--ink);font-size:19px;font-weight:900;font-family:var(--serif);letter-spacing:-.03em}
.resbar select{padding:4px 7px;border:1px solid var(--rule2);background:var(--paper);font-size:11.5px;outline:none;cursor:pointer;font-family:var(--mono)}
.actchips{display:flex;flex-wrap:wrap;gap:4px;flex:1}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(246px,1fr));gap:16px}
.eq{background:var(--paper);border:1px solid var(--rule);border-top:3px solid var(--threat);
  cursor:pointer;display:flex;flex-direction:column;position:relative;transition:border-color .12s}
.eq[data-k="cuas"]{border-top-color:var(--counter)}
.eq:hover{border-color:var(--ink2);border-top-color:var(--ink)}
.eq.unconf-card{border-style:dashed;border-top-color:var(--violet)}

.eq-img{height:128px;background:var(--paper2);display:grid;place-items:center;position:relative;overflow:hidden;border-bottom:1px solid var(--rule)}
.eq-img>svg{width:70%;height:64%;opacity:.55;stroke:var(--ink2);fill:none;stroke-width:1.2;stroke-linejoin:round;position:relative}
.eq-img>img{width:100%;height:100%;object-fit:cover;display:block}
.eq-img .ph{position:absolute;bottom:0;left:0;right:0;padding:2px 8px;font-size:8.5px;font-family:var(--mono);
  color:var(--muted);letter-spacing:.05em;background:var(--paper2);border-top:1px dotted var(--rule)}
.eq-img.hasimg .ph{color:#EDEDEA;background:rgba(10,12,14,.78);border-top:none}
.eq-top{position:absolute;top:7px;left:8px;right:8px;display:flex;gap:5px;align-items:flex-start;z-index:3}
.eq-top .sp{flex:1}
.eq-b{padding:12px 14px 13px;flex:1;display:flex;flex-direction:column;gap:4px}
.eq-name{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:-.02em;line-height:1.28}
.eq-sub{font-size:10.5px;color:var(--muted);font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eq-meta{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
/* 제원 요약 — 리더점 조판 */
.eq-kv{display:flex;flex-direction:column;font-size:11px;margin-top:auto;padding-top:10px}
.eq-kv div{display:flex;align-items:baseline;gap:4px;min-width:0;padding:2.5px 0}
.eq-kv span{color:var(--muted);flex-shrink:0;font-size:10px;font-family:var(--mono)}
.eq-kv i{flex:1;border-bottom:1px dotted var(--rule);min-width:8px;transform:translateY(-3px)}
.eq-kv b{font-family:var(--mono);font-weight:500;font-size:10.5px;flex-shrink:0;max-width:58%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eq-act{display:flex;border-top:1px solid var(--rule)}
.eq-act button{flex:1;border:none;border-right:1px solid var(--rule);background:transparent;padding:7px 4px;
  font-size:10.5px;cursor:pointer;color:var(--muted);font-family:var(--mono)}
.eq-act button:last-child{border-right:none}
.eq-act button:hover{background:var(--paper3);color:var(--ink)}
.eq-act button.on{color:var(--threat);font-weight:600}

.empty{padding:64px 20px;text-align:center;color:var(--muted)}
.empty svg{width:38px;height:38px;stroke:var(--rule2);fill:none;stroke-width:1.4;margin-bottom:12px}

/* ══════════ 항목 상세 ══════════ */
.dt-head{background:var(--paper);border:1px solid var(--rule);border-top:5px solid var(--threat);padding:24px;margin-bottom:20px}
.dt-head.cuas{border-top-color:var(--counter)}
.dt-grid{display:grid;grid-template-columns:294px minmax(0,1fr);gap:28px;align-items:start}
@media(max-width:880px){.dt-grid{grid-template-columns:1fr}}
.dt-img{background:var(--paper2);border:1px solid var(--rule);height:206px;display:grid;place-items:center;position:relative;overflow:hidden}
.dt-img>svg{width:74%;height:68%;opacity:.6;stroke:var(--ink2);fill:none;stroke-width:1.1;stroke-linejoin:round}
.dt-img>img{width:100%;height:100%;object-fit:contain;display:block;background:var(--paper3)}
.imgnote{margin-top:9px;font-size:10.5px;color:var(--muted);line-height:1.6}
.imgnote b{color:var(--ink2)}
.imgcredit{margin-top:9px;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);padding:9px 0;font-size:11px;line-height:1.6}
.imgcredit dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 12px}
.imgcredit dt{color:var(--muted);font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding-top:2px}
.imgcredit dd{margin:0;word-break:break-word}
.imgacts{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}

.dt-title{font-size:clamp(24px,3.2vw,34px);font-weight:900;letter-spacing:-.035em;margin-bottom:6px}
.dt-orig{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-bottom:10px;line-height:1.7}
.dt-tags{display:flex;flex-wrap:wrap;gap:4px;margin:13px 0}
.dt-quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(124px,1fr));margin-top:16px;
  border-top:1.5px solid var(--ink);border-bottom:1px solid var(--rule)}
.qk{padding:11px 16px 11px 0;border-right:1px dotted var(--rule)}
.qk:last-child{border-right:none}
.qk span{display:block;font-size:9px;color:var(--muted);font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase}
.qk b{font-size:16px;font-family:var(--mono);font-weight:600;letter-spacing:-.03em;line-height:1.4}

.tabs{display:flex;border-bottom:1.5px solid var(--ink);margin-bottom:20px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:none;background:none;padding:9px 16px;cursor:pointer;color:var(--muted);font-size:12.5px;font-weight:500;
  border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;font-family:var(--sans)}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--threat)}

.spec-sec{margin-bottom:26px}
.spec-sec>h3{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
  color:var(--muted);margin-bottom:6px;padding-bottom:5px;border-bottom:1px solid var(--ink)}
/* 제원표 — 리더점으로 라벨과 값을 잇는다 (연감 조판) */
.stab{width:100%;border-collapse:collapse;font-size:12.5px}
.stab tr{border-bottom:1px dotted var(--rule)}
.stab tr:last-child{border-bottom:none}
.stab td{padding:7px 0;vertical-align:baseline}
.stab td:first-child{color:var(--muted);width:186px;font-size:11.5px;font-family:var(--mono);position:relative;padding-right:14px}
.stab td:first-child span{background:var(--paper);padding-right:7px;position:relative;z-index:1}
.stab td:first-child::after{content:"";position:absolute;left:0;right:8px;bottom:11px;border-bottom:1px dotted var(--rule);z-index:0}
.stab tr:hover td:first-child span{background:var(--paper2)}
.stab td:nth-child(2){font-family:var(--mono);font-weight:500;line-height:1.7}
.stab tr:hover td{background:var(--paper2)}
.na{color:var(--muted);font-style:italic;font-family:var(--sans)!important;font-weight:400!important}
.srcref{display:inline-block;font-family:var(--mono);font-size:8.5px;padding:0 3px;background:transparent;color:var(--muted);
  cursor:pointer;border:1px solid var(--rule2);margin-left:4px;vertical-align:2px;letter-spacing:.05em}
.srcref:hover{border-color:var(--threat);color:var(--threat)}
.flagnote{display:inline-block;font-size:9.5px;padding:0 4px;font-weight:500;margin-left:5px;font-family:var(--mono);
  border:1px solid;background:transparent;color:var(--signal);border-color:var(--signal)}
.flagnote.conflict{color:var(--threat);border-color:var(--threat)}
.flagnote.claim{color:var(--violet);border-color:var(--violet)}
/* 각주 — 출처 상충 표시 */
.dagger{color:var(--threat);font-weight:700;font-family:var(--serif)}
.footnote{font-size:11px;color:var(--ink2);border-top:1px solid var(--rule);margin-top:4px;padding-top:4px;line-height:1.6}

.pl{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:7px}
.pl li{display:flex;gap:10px;font-size:12.5px;color:var(--ink2);line-height:1.7}
.pl li::before{content:"—";color:var(--rule2);flex-shrink:0;font-family:var(--mono)}
.pl.neg li::before{content:"×";color:var(--threat)}
.pl.pos li::before{content:"+";color:var(--ok)}

/* ══════════ 비교 ══════════ */
.cmp-scroll{overflow-x:auto;border:1px solid var(--rule);background:var(--paper)}
.cmp{border-collapse:collapse;font-size:12.5px;width:100%;min-width:660px}
.cmp th,.cmp td{padding:9px 13px;border-bottom:1px dotted var(--rule);text-align:left;vertical-align:top}
.cmp thead th{position:sticky;top:0;background:var(--paper);z-index:2;border-bottom:2px solid var(--ink);
  font-size:13px;min-width:156px;font-family:var(--serif);font-weight:700}
.cmp tbody td:first-child,.cmp thead th:first-child{position:sticky;left:0;background:var(--paper);z-index:1;
  color:var(--muted);font-size:11px;font-family:var(--mono);min-width:150px;max-width:150px;border-right:1px solid var(--rule)}
.cmp thead th:first-child{z-index:3}
.cmp td:not(:first-child){font-family:var(--mono);font-weight:500}
.cmp tr.sec td{background:var(--paper3);font-weight:600;font-size:9.5px;font-family:var(--mono);letter-spacing:.18em;
  text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--ink)}
.cmp td.hi{color:var(--ok);font-weight:700;background:transparent}
.cmp td.hi::after{content:" ▲";font-size:8px;vertical-align:2px}
.cmp td.lo{color:var(--muted)}
.cmp .rm{float:right;cursor:pointer;color:var(--muted);font-weight:700;padding:0 3px}
.cmp .rm:hover{color:var(--threat)}
.cmpchart{display:flex;flex-direction:column;margin:10px 0 22px}
.cmprow{display:grid;grid-template-columns:150px 1fr 90px;gap:12px;align-items:center;font-size:11.5px;
  padding:4px 0;border-bottom:1px dotted var(--rule)}
.cmprow .t{height:11px;border:1px solid var(--rule);overflow:hidden}
.cmprow .t i{display:block;height:100%;background:var(--ink2)}
.cmprow .v{font-family:var(--mono);font-size:11px;text-align:right}
.picker{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}

/* ══════════ 다층방어 ══════════ */
.layer{display:flex;flex-direction:column}
.lstep{display:grid;grid-template-columns:32px minmax(0,1fr);gap:16px;position:relative;padding-bottom:16px}
.lstep::before{content:"";position:absolute;left:16px;top:32px;bottom:0;width:1px;border-left:1px dotted var(--rule2)}
.lstep:last-child::before{display:none}
.lstep .num{width:32px;height:32px;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:12px;
  background:var(--paper);border:1px solid var(--rule2);z-index:1;color:var(--muted)}
.lstep.act .num{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.lstep .body{background:var(--paper);border:1px solid var(--rule);padding:14px 16px}
.lstep.act .body{border-left:3px solid var(--threat)}
.lstep .body h4{font-size:14px;margin-bottom:5px;font-family:var(--serif)}
.lstep .body p{margin:0 0 8px;font-size:12.5px;color:var(--ink2)}
.recl{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.reci{display:flex;gap:9px;padding:10px 13px;background:var(--paper2);border-left:2px solid var(--counter);font-size:12px}
.reci .rn{font-weight:700;font-size:13px;font-family:var(--serif)}
.reci .rr{color:var(--ink2);font-size:11.5px;margin-top:3px}
.reci .rl{color:var(--signal);font-size:11px;margin-top:3px}
.callout{padding:12px 15px;font-size:12.5px;line-height:1.7;background:var(--paper2);
  border:1px solid var(--rule);border-left:3px solid var(--signal);color:var(--ink2)}
.callout b{color:var(--signal)}
.callout.info{border-left-color:var(--counter)}
.callout.info b{color:var(--counter)}

/* ══════════ 출처 ══════════ */
.srctab{width:100%;border-collapse:collapse;font-size:12px}
.srctab th{text-align:left;padding:7px 10px 7px 0;border-bottom:1.5px solid var(--ink);font-size:9px;color:var(--muted);
  font-family:var(--mono);letter-spacing:.16em;text-transform:uppercase}
.srctab td{padding:9px 10px 9px 0;border-bottom:1px dotted var(--rule);vertical-align:top}
.srctab tr:hover td{background:var(--paper2)}
.tier{display:inline-grid;place-items:center;width:19px;height:19px;font-family:var(--mono);font-size:10.5px;font-weight:700;
  border:1.5px solid;background:transparent}
.tier.t1{color:var(--ok);border-color:var(--ok)}
.tier.t2{color:var(--counter);border-color:var(--counter)}
.tier.t3{color:var(--violet);border-color:var(--violet)}
.tier.t4{color:var(--signal);border-color:var(--signal)}
.tier.t5{color:var(--threat);border-color:var(--threat)}
.tier.t6{color:var(--muted);border-color:var(--muted)}
.confkey{display:grid;gap:10px}
.confkey div{display:flex;gap:11px;align-items:flex-start;font-size:12px}

/* ══════════ 폼 ══════════ */
.fld{margin-bottom:13px}
.fld label{display:block;font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-bottom:5px;letter-spacing:.12em;text-transform:uppercase}
.fld input,.fld select,.fld textarea{width:100%;padding:7px 9px;border:1px solid var(--rule2);background:var(--paper2);
  font-size:12.5px;outline:none;font-family:inherit}
.fld textarea{min-height:72px;resize:vertical;font-family:var(--mono);font-size:11.5px}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--ink);background:var(--paper)}
.fld .hint{font-size:10.5px;color:var(--muted);margin-top:4px;line-height:1.55}

.drop{border:1.5px dashed var(--rule2);padding:26px 16px;text-align:center;cursor:pointer;background:var(--paper2)}
.drop:hover,.drop.over{border-color:var(--ink);background:var(--paper3)}
.drop svg{width:25px;height:25px;stroke:var(--muted);fill:none;stroke-width:1.5;margin-bottom:8px}
.drop b{display:block;font-size:12.5px;margin-bottom:3px}
.drop span{font-size:11px;color:var(--muted)}
.preview{margin-top:13px;border:1px solid var(--rule);overflow:hidden;background:var(--paper3)}
.preview img{width:100%;max-height:230px;object-fit:contain;display:block}
.preview .pmeta{padding:5px 10px;font-family:var(--mono);font-size:10px;color:var(--muted);border-top:1px solid var(--rule);background:var(--paper2)}
.gauge{height:8px;border:1px solid var(--rule);overflow:hidden;margin:7px 0 4px}
.gauge i{display:block;height:100%;background:var(--counter)}
.gauge i.warn{background:var(--signal)} .gauge i.full{background:var(--threat)}

.qz{max-width:660px;margin:0 auto}
.qopt{display:block;width:100%;text-align:left;padding:12px 16px;border:1px solid var(--rule);background:var(--paper2);
  margin-bottom:7px;cursor:pointer;font-size:13px}
.qopt:hover{border-color:var(--ink2);background:var(--paper3)}
.qopt.right{border-color:var(--ok);border-left:4px solid var(--ok);color:var(--ok);font-weight:700}
.qopt.wrong{border-color:var(--threat);border-left:4px solid var(--threat);color:var(--threat)}
.qopt:disabled{cursor:default}
.prog{height:3px;background:var(--rule);overflow:hidden;margin-bottom:20px}
.prog i{display:block;height:100%;background:var(--ink)}

.modal{position:fixed;inset:0;background:rgba(12,14,16,.66);z-index:200;display:grid;place-items:center;padding:20px}
.modal-in{background:var(--paper);border:1px solid var(--ink);max-width:660px;width:100%;max-height:88vh;overflow:auto;box-shadow:var(--shadow-float)}
.modal-h{padding:15px 20px;border-bottom:1.5px solid var(--ink);display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--paper);z-index:2}
.modal-h h3{font-size:16px;flex:1;font-family:var(--serif)}
.modal-b{padding:20px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--paper);
  padding:10px 20px;font-size:12.5px;font-weight:500;z-index:300;opacity:0;transition:.25s;pointer-events:none;
  box-shadow:var(--shadow-float);max-width:80vw;text-align:center}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}

/* ══════════ 인쇄 ══════════ */
@media print{
  :root{--desk:#fff;--paper:#fff;--paper2:#fff;--paper3:#fff;--ink:#000;--ink2:#222;--muted:#555;--rule:#999;--rule2:#666}
  .topbar,.tabs,.btn,.eq-act,.filters,.imgacts,.exq,.bigsearch{display:none!important}
  body{background:#fff}
  .card,.dt-head,.masthead{border:1px solid #999;break-inside:avoid}
  .eq{break-inside:avoid}
  a{color:#000}
  a[href^="http"]::after{content:" (" attr(href) ")";font-size:9px;color:#555;word-break:break-all}
}
@media(max-width:820px){
  .masthead{padding:24px 18px}
  .wrap{padding:16px 14px 70px}
  .brand-txt{display:none}
  .topbar-in{flex-wrap:wrap;height:auto;padding:8px 14px;row-gap:6px}
  .nav{order:2;flex:1;min-width:0;margin-left:0}
  .nav a{padding:8px 9px;border-bottom-width:2px;margin-bottom:0}
  .top-right{order:3}
  .searchwrap{order:4;flex:0 0 100%;max-width:none;width:100%;padding-bottom:6px}
  .dateline div{padding:9px 14px 9px 0;margin-right:14px}
  .dateline b{font-size:17px}
  .stab td:first-child{width:130px}
}

/* 업로드 이미지를 긴 변 1400px, JPEG 품질 0.85로 축소해 저장 용량을 관리한다 */
function shrink(file,maxPx){
 return new Promise((res,rej)=>{
  const fr=new FileReader();
  fr.onerror=()=>rej(new Error("파일을 읽을 수 없습니다"));
  fr.onload=()=>{
   const im=new Image();
   im.onerror=()=>rej(new Error("이미지 형식을 인식할 수 없습니다"));
   im.onload=()=>{
    const M=maxPx||1400;
    let{width:w,height:h}=im;
    const sc=Math.min(1,M/Math.max(w,h));
    w=Math.round(w*sc);h=Math.round(h*sc);
    const c=document.createElement("canvas");c.width=w;c.height=h;
    const x=c.getContext("2d");x.imageSmoothingQuality="high";x.drawImage(im,0,0,w,h);
    c.toBlob(b=>b?res({blob:b,w,h}):rej(new Error("이미지 변환에 실패했습니다")),"image/jpeg",.85);
   };
   im.src=fr.result;
  };
  fr.readAsDataURL(file);
 });
}

function parseQ(q){
 const r={kind:null,country:[],mission:[],airframe:[],size:[],prop:[],status:[],cs:[],ce:[],war:null,num:{},text:[],notes:[]};
 if(!q||!q.trim())return null;
 const s=q.trim();
 // 국가
 TAX.country.forEach(c=>{if(new RegExp(c.ko+"|"+c.en,"i").test(s))r.country.push(c.id)});
 if(/한국|대한민국|국산|korea/i.test(s)&&!r.country.includes("KR"))r.country.push("KR");
 // 동의어
 SYN.forEach(([re,g,v])=>{if(re.test(s)){if(g==="war")r.war=true;else if(!r[g].includes(v))r[g].push(v)}});
 // 휴대형 / 이동형
 if(/휴대형|휴대용|portable|handheld/i.test(s))r.notes.push({k:"mobility",re:/휴대/});
 if(/이동형|차량|mobile|vehicle/i.test(s))r.notes.push({k:"mobility",re:/이동|차량/});
 if(/고정형|fixed site/i.test(s))r.notes.push({k:"mobility",re:/고정/});
 // GNSS 없이
 if(/gnss ?없이|gps ?없이|gnss[- ]?denied|위성항법 ?없이/i.test(s))r.notes.push({k:"gnss",lte:2});
 // 수치 조건
 NUMF.forEach(([re,key])=>{
  /* re.source에 |(OR)가 있으므로 반드시 비캡처 그룹으로 감싼다 — 그렇지 않으면 숫자 캡처가 누락된다 */
  const m=s.match(new RegExp("(?:"+re.source+")[^0-9]{0,10}(\\d+(?:\\.\\d+)?)\\s*(km|kg|시간|분|h|min|km/h)?\\s*(이상|초과|이하|미만|over|above|under)?","i"));
  if(m&&m[1]!=null){const val0=parseFloat(m[1]);if(isNaN(val0))return;
   let val=val0;const unit=(m[2]||"").toLowerCase();const cmp=m[3]||"이상";
   if(key==="endur"&&(unit==="시간"||unit==="h"))val*=60;
   r.num[key]={v:val,op:/이하|미만|under/i.test(cmp)?"lte":"gte"}}
 });
 /* 종류(드론/안티드론) 추론 — 명시어 우선, 없으면 매칭된 패싯 수로 판정.
    "드론 레이더"처럼 두 단어가 섞인 질의를 잘못 분류하지 않도록 점수제로 처리한다. */
 let dS=r.mission.length+r.airframe.length+r.size.length+r.prop.length;
 let cS=r.cs.length+r.ce.length;
 if(r.num.detRange!=null||r.num.engRange!=null)cS+=2;
 if(r.num.rangeMax!=null||r.num.endur!=null||r.num.warhead!=null||r.num.mtow!=null)dS+=2;
 if(/안티\s?드론|대드론|c-?uas|counter[- ]?uas|대공무기|방어체계/i.test(s))cS+=6;
 if(/무인기|\buav\b|기체/i.test(s))dS+=2;
 if(/드론/.test(s)&&!/안티\s?드론|대드론/.test(s))dS+=1;
 r.kind=(cS>dS)?"cuas":(dS>0?"drone":null);
 // 반대 영역 패싯은 제거 — 교차 조건으로 결과가 0이 되는 것을 방지
 if(r.kind==="cuas"){r.mission=[];r.airframe=[];r.size=[];r.prop=[]}
 else if(r.kind==="drone"){r.cs=[];r.ce=[]}
 const any=r.kind||r.country.length||r.status.length||r.war||Object.keys(r.num).length||r.notes.length;
 r.text=s.split(/\s+/).filter(w=>w.length>1);
 return any?r:null;
}

/* ==========================================================================
   필터 엔진
   ========================================================================== */
function matches(it){
 const f=S.f;
 if(f.kind&&it.kind!==f.kind)return false;
 if(f.country.length&&!f.country.includes(it.country))return false;
 if(f.conf.length&&!f.conf.includes(it.conf))return false;
 if(f.status.length&&!f.status.includes(it.status))return false;
 if(f.war===true&&!it.war)return false;
 if(f.verify===true&&!it.verify)return false;
 const has=(arr,sel)=>!sel.length||sel.every(v=>(arr||[]).includes(v));
 if(it.kind==="drone"){
  if(f.mission.length&&!has(it.mission,f.mission))return false;
  if(f.airframe.length&&!has(it.airframe,f.airframe))return false;
  if(f.size.length&&!has(it.size,f.size))return false;
  if(f.prop.length&&!has(it.prop,f.prop))return false;
  if(f.cs.length||f.ce.length||f.ci.length||f.kill.length)return false;
 }else{
  if(f.cs.length&&!has(it.cSensor,f.cs))return false;
  if(f.ci.length&&!has(it.cIdent,f.ci))return false;
  if(f.ce.length&&!has(it.cEffect,f.ce))return false;
  if(f.kill.length&&!f.kill.includes(it.kill))return false;
  if(f.mission.length||f.airframe.length||f.size.length||f.prop.length)return false;
 }
 for(const k in f.num){const c=f.num[k];const v=(it.num||{})[k];
  if(c.min!=null){if(v==null||v<c.min)return false}
  if(c.max!=null){if(v==null||v>c.max)return false}}
 const p=S.parsed;
 if(p){
  if(p.kind&&it.kind!==p.kind)return false;
  if(p.country.length&&!p.country.includes(it.country))return false;
  if(p.war&&!it.war)return false;
  if(p.status.length&&!p.status.includes(it.status))return false;
  if(it.kind==="drone"){
   if(p.mission.length&&!p.mission.some(v=>(it.mission||[]).includes(v)))return false;
   if(p.airframe.length&&!p.airframe.some(v=>(it.airframe||[]).includes(v)))return false;
   if(p.size.length&&!p.size.some(v=>(it.size||[]).includes(v)))return false;
   if(p.prop.length&&!p.prop.some(v=>(it.prop||[]).includes(v)))return false;
   if(p.cs.length||p.ce.length)return false;
  }else{
   if(p.cs.length&&!p.cs.some(v=>(it.cSensor||[]).includes(v)))return false;
   if(p.ce.length&&!p.ce.some(v=>(it.cEffect||[]).includes(v)))return false;
   if(p.mission.length||p.airframe.length||p.size.length||p.prop.length)return false;
  }
  for(const k in p.num){const c=p.num[k];const v=(it.num||{})[k];
   if(v==null)return false;
   if(c.op==="gte"&&v<c.v)return false;
   if(c.op==="lte"&&v>c.v)return false}
  for(const n of p.notes){
   if(n.k==="mobility"){const mv=plain(it.sp&&it.sp.mobility)||"";if(!n.re.test(mv))return false}
   if(n.k==="gnss"){const g=(it.an&&it.an.gnss);const gd=it.sp&&it.sp.gnssden;
    if(!(gd||(g!=null&&g<=n.lte)))return false}
  }
 }else if(f.q){
  const q=f.q.toLowerCase();
  const hay=[it.ko,it.en,it.orig,it.mfr,(it.alias||[]).join(" "),cty(it.country).ko,cty(it.country).en,
   (it.mission||[]).map(m=>taxName("mission",m)).join(" "),
   (it.cEffect||[]).map(m=>taxName("cEffect",m)).join(" ")].join(" ").toLowerCase();
  if(!hay.includes(q))return false;
 }
 return true;
}
function results(){
 let r=ALL().filter(matches);
 const key={name:(a,b)=>nm(a).localeCompare(nm(b),"ko"),
  conf:(a,b)=>a.conf.localeCompare(b.conf),
  country:(a,b)=>cty(a.country).ko.localeCompare(cty(b.country).ko,"ko"),
  updated:(a,b)=>(b.updated||"").localeCompare(a.updated||""),
  year:(a,b)=>(b.year||0)-(a.year||0)}[S.sort];
 return r.sort(key);
}

 ["country","mission","airframe","size","prop","status","conf","cs","ci","ce","kill"].forEach(k=>n+=f[k].length);

function explainParsed(p){
 const a=[];
 if(p.kind)a.push(p.kind==="drone"?"드론":"안티드론 장비");
 if(p.country.length)a.push("국가 "+p.country.map(c=>cty(c).ko).join("·"));
 p.mission.forEach(m=>a.push("임무 "+taxName("mission",m)));
 p.airframe.forEach(m=>a.push("형상 "+taxName("airframe",m)));
 p.prop.forEach(m=>a.push("추진 "+taxName("prop",m)));
 p.size.forEach(m=>a.push("크기 "+taxName("size",m)));
 p.cs.forEach(m=>a.push("센서 "+taxName("cSensor",m)));
 p.ce.forEach(m=>a.push("대응 "+taxName("cEffect",m)));
 if(p.war)a.push("실전 운용");
 Object.keys(p.num).forEach(k=>a.push(`${lab(k)} ${p.num[k].v}${p.num[k].op==="gte"?" 이상":" 이하"}`));
 p.notes.forEach(n=>a.push(n.k==="gnss"?"GNSS 의존도 낮음":"배치형태 조건"));
 return a.join(" · ")||"조건 없음";
}

function recommendSensors(d){
 const a=d.an||{},out=[];
 const spd=(d.num||{}).vmax||0, sz=(d.num||{}).mtow||0;
 if(a.rf>=3)out.push({id:"rf",why:"조종·영상 링크 의존도가 높아 수동 RF 탐지로 조기 포착이 가능합니다.",lim:"광섬유 조종·완전 자율비행 기체에는 무력합니다."});
 out.push({id:"radar",why:sz<5?"표적이 매우 작아 마이크로도플러 분류가 가능한 소형 표적 특화 레이더가 필요합니다.":"금속·복합재 구조로 X-밴드 레이더 탐지가 가능합니다.",
  lim:sz<5?"RCS가 극히 작아 일반 방공 레이더로는 탐지가 어렵습니다.":"저고도 진입 시 지형 차폐로 탐지거리가 급감합니다."});
 if((d.prop||[]).includes("piston")||(d.airframe||[]).includes("multi")||(d.airframe||[]).includes("hexa"))
  out.push({id:"acou",why:"피스톤 엔진·다수 로터로 음향 신호가 커 음향센서 탐지에 유리합니다.",lim:"탐지거리가 수 km 이내로 짧고 배경소음에 취약합니다."});
 out.push({id:"eoir",why:spd>250?"고속 표적의 최종 확인과 사격통제에 냉각형 열영상이 필요합니다.":"주·야간 최종 식별과 교전 판단에 필수입니다.",
  lim:"안개·강우·야간 저대비 조건에서 유효거리가 감소합니다."});
 if((d.prop||[]).includes("turbo"))out.push({id:"eoir",why:"제트 배기의 강한 적외선 신호로 IR 추적이 특히 유효합니다.",lim:"고고도·고속 표적은 추적 유지 시간이 짧습니다."});
 out.push({id:"fusion",why:"단일 센서로는 오탐과 사각이 남습니다. 레이더+RF+EO/IR 융합이 사실상 필수입니다.",lim:"체계 통합 비용과 운용 인력 소요가 큽니다."});
 const seen=new Set();return out.filter(o=>!seen.has(o.id)&&seen.add(o.id));
}
function recommendEffectors(d){
 const a=d.an||{},out=[];
 const spd=(d.num||{}).vmax||0;
 if(a.rf>=3)out.push({id:"rfjam",why:"조종 링크 의존도가 높아 RF 재밍으로 임무 무산 확률이 높습니다.",lim:"전파법상 제약이 크고 주변 통신에 간섭을 유발합니다."});
 if(a.gnss>=3)out.push({id:"gnssjam",why:"위성항법 의존도가 높아 GNSS 재밍이 항법 오차를 유발합니다.",lim:"CRPA 안테나 탑재 기체에는 효과가 크게 감소하며 아군 항법에도 영향을 줍니다."});
 if(a.rf>=4)out.push({id:"takeover",why:"알려진 프로토콜을 사용할 경우 통제권 인수로 온전한 포획이 가능합니다.",lim:"프로토콜 DB에 없는 기체에는 적용 불가이며 법적 검토가 필요합니다."});
 if(spd&&spd<200)out.push({id:"intdrone",why:"저속 표적으로 요격드론의 추적·충돌 요격이 성립합니다. 교환비가 가장 유리한 수단입니다.",lim:"숙련 조종수와 대량 재고가 필요하며 야간·악천후 성능 편차가 큽니다."});
 out.push({id:"gun",why:"공중폭발탄 기관포는 소형 표적에 대한 명중 확률이 높습니다.",lim:"도심 낙탄 위험이 커 평시 운용에 강한 제약이 있습니다."});
 if(a.thI>=4||spd>250)out.push({id:"missile",why:"고가치 표적 또는 고속 표적에 대해 확실한 격추가 필요할 때 사용합니다.",lim:"교환비가 극도로 불리해 물량 공세에는 지속 불가합니다."});
 out.push({id:"laser",why:"발당 비용이 극히 낮아 반복 교전에 유리하며 부수피해가 작습니다.",lim:"기상 감쇠가 크고 표적당 조사 시간이 필요해 동시 다표적 대응에 한계가 있습니다."});
 if((d.num||{}).mtow&&d.num.mtow<20&&spd<150)out.push({id:"net",why:"저속·소형 표적으로 그물 포획이 가능하며 증거 확보에 유리합니다.",lim:"유효거리가 매우 짧아 근접 방호에 한정됩니다."});
 const seen=new Set();return out.filter(o=>!seen.has(o.id)&&seen.add(o.id));
}

             reci("레이더 표적분류","마이크로도플러로 드론/조류를 구분합니다.","호버링·활공 구간에서 분류가 어려울 수 있습니다.",systemsWith("cIdent","radcls"))]).join("");

 };

let QZ=null;
function buildQuiz(){
 const pool=ALL().filter(x=>Object.keys(x.sp).length>4);
 const qs=[];
 const pick=a=>a[Math.floor(Math.random()*a.length)];
 const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
 // 국가 문제
 for(let i=0;i<3;i++){const it=pick(pool);
  const wrong=shuffle(TAX.country.filter(c=>c.id!==it.country)).slice(0,3);
  qs.push({q:`${nm(it)}의 개발국가는?`,a:cty(it.country).ko,
   o:shuffle([cty(it.country).ko,...wrong.map(c=>c.ko)]),
   e:`${nm(it)}는 ${cty(it.country).ko}에서 개발되었습니다. (${plain(it.sp.mfr)||"제조사 미공개"})`,id:it.id})}
 // 개념 문제 (고정)
 qs.push({q:"안티드론 장비 제원에서 '탐지거리'와 '무력화(대응)거리'의 관계로 옳은 것은?",
  a:"서로 다른 값이며 대개 무력화거리가 훨씬 짧다",
  o:shuffle(["서로 다른 값이며 대개 무력화거리가 훨씬 짧다","항상 같은 값이다","무력화거리가 항상 더 길다","탐지거리는 무력화거리의 절반이다"]),
  e:"부코벨-AD는 탐지 100 km, 재밍 20 km로 5배 차이가 납니다. 두 값을 혼동하면 방어 설계가 크게 어긋납니다."});
 qs.push({q:"다층방어 9단계에서 '식별(Identification)'이 특히 중요한 이유는?",
  a:"아군·민간기를 오인 대응하는 것을 막기 때문",
  o:shuffle(["아군·민간기를 오인 대응하는 것을 막기 때문","탐지거리를 늘려주기 때문","재밍 출력을 높여주기 때문","비용을 줄여주기 때문"]),
  e:"탐지·추적만으로는 표적의 정체를 알 수 없습니다. 식별 없이 교전하면 아군기·민항기 오격 위험이 발생합니다."});
 qs.push({q:"신뢰도 등급 D가 의미하는 것은?",a:"단일 출처 또는 상충 정보 존재",
  o:shuffle(["단일 출처 또는 상충 정보 존재","복수의 공식 출처로 확인","완전 미확인","제조사 공식 확인"]),
  e:"D는 출처가 하나뿐이거나 출처 간 수치가 충돌하는 상태입니다. 교육·연구 인용 시 반드시 명시해야 합니다."});
 qs.push({q:"게란-2(샤헤드-136 계열)에 대해 음향센서 탐지가 상대적으로 유효한 이유는?",
  a:"피스톤 엔진과 프로펠러로 음향 신호가 크기 때문",
  o:shuffle(["피스톤 엔진과 프로펠러로 음향 신호가 크기 때문","고고도로만 비행하기 때문","금속 동체 비중이 높기 때문","GNSS를 쓰지 않기 때문"]),
  e:"프로펠러 구동 OWA 드론은 특유의 엔진음이 커 음향센서로 조기 포착이 가능합니다. 반대로 제트형 게란-3는 접근 시간이 짧아 대응 창이 좁습니다.",id:"ru_geran2"});
 qs.push({q:"레이저 대공무기의 가장 큰 제약으로 옳은 것은?",a:"안개·강우 등 기상 조건에서 출력이 크게 감쇠한다",
  o:shuffle(["안개·강우 등 기상 조건에서 출력이 크게 감쇠한다","탄약 재보급 소요가 크다","전파 간섭을 크게 일으킨다","저속 표적에만 유효하다"]),
  e:"레이저는 발당 비용이 극히 낮지만 대기 조건에 민감하고, 표적마다 조사 시간이 필요해 동시 다표적 대응에 한계가 있습니다.",id:"kr_cheongwang"});
 return shuffle(qs).slice(0,8);
}

function route(){
 const h=location.hash||"#/";
 const p=h.replace(/^#\//,"").split("/");
 const app=document.getElementById("app");
 document.querySelector(".modal")?.remove();   /* 화면 이동 시 열린 모달 정리 */
 let html="";
 if(p[0]===""||p[0]==="home"){S.view="home";html=vHome()}
 else if(p[0]==="drones"){S.view="drones";html=vCatalog("drone")}
 else if(p[0]==="cuas"){S.view="cuas";html=vCatalog("cuas")}
 else if(p[0]==="item"&&p[1]){S.view="item";html=vDetail(p[1])}
 else if(p[0]==="compare"){S.view="compare";
  if(p[1]){S.cmp=p[1].split(",").filter(byId).slice(0,5)}
  html=vCompare()}
 else if(p[0]==="match"){S.view="match";if(p[1]&&byId(p[1]))S.matchSel=p[1];html=vMatch()}
 else if(p[0]==="sources"){S.view="sources";html=vSources()}
 else if(p[0]==="learn"){S.view="learn";html=vLearn()}
 else if(p[0]==="admin"){S.view="admin";html=vAdmin()}
 else html=`<div class="empty card">페이지를 찾을 수 없습니다. <a href="#/">홈으로</a></div>`;
 app.innerHTML=html;
 document.querySelectorAll(".nav a").forEach(a=>a.classList.toggle("on",a.dataset.v===S.view));
 const badge=document.querySelector(".cmpbadge");
 if(badge){badge.querySelector("i")?.remove();
  if(S.cmp.length)badge.insertAdjacentHTML("beforeend",`<i>${S.cmp.length}</i>`)}
 window.scrollTo({top:0,behavior:"instant"});
}
function rerender(){route()}

function applyTheme(){
 const r=document.documentElement;
 if(S.theme==="auto")r.removeAttribute("data-theme");

/* ---------- 제안 검색 ---------- */
function suggest(q){
 const box=document.getElementById("sugg");if(!box)return;
 if(!q||q.length<1){box.hidden=true;return}
 const lq=q.toLowerCase();
 const hits=ALL().filter(x=>[x.ko,x.en,x.orig,(x.alias||[]).join(" ")].join(" ").toLowerCase().includes(lq)).slice(0,7);
 const p=parseQ(q);
 let h="";
 if(p)h+=`<div class="h">자연어 조건으로 검색</div><div data-run="1">🔎 <b>${esc(explainParsed(p))}</b></div>`;
 if(hits.length){h+=`<div class="h">장비</div>`+hits.map(x=>
  `<div data-goto="${x.id}"><span class="conf ${x.conf}">${x.conf}</span> ${cty(x.country).f} <b>${esc(nm(x))}</b>
   <span class="tiny muted">${esc(x.orig||x.en||"")}</span></div>`).join("")}
 if(!h){box.hidden=true;return}
 box.innerHTML=h;box.hidden=false;
}
function runSearch(q){
 S.f.q=q;S.parsed=parseQ(q);
 const box=document.getElementById("sugg");if(box)box.hidden=true;
 const kind=S.parsed&&S.parsed.kind?S.parsed.kind:(S.f.kind||"drone");
 location.hash=kind==="cuas"?"#/cuas":"#/drones";
 if(location.hash===(kind==="cuas"?"#/cuas":"#/drones"))rerender();
}

/* ---------- CSV ---------- */
function dl(name,text,type){
 const b=new Blob([`﻿`+text],{type:type||"text/csv;charset=utf-8"});
 const u=URL.createObjectURL(b),a=document.createElement("a");
 a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(u),1500);
}
function csvEsc(s){s=String(s==null?"":s);return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s}
function exportAllCSV(){
 const keys=["id","kind","country","ko","en","orig","mfr","year","status","conf","war","verify","updated"];
 const specKeys=[...new Set(ALL().flatMap(x=>Object.keys(x.sp||{})))];
 const head=[...keys,...specKeys.map(k=>"sp_"+k),"sources"];
 const rows=ALL().map(x=>[
  ...keys.map(k=>k==="mfr"?(plain(x.sp.mfr)||""):(x[k]??"")),
  ...specKeys.map(k=>plain(x.sp[k])||""),
  evidence(x).map(e=>e.u).join(" | ")]);
 dl("gdcal_export.csv",[head,...rows].map(r=>r.map(csvEsc).join(",")).join("\n"));
}
function exportCmpCSV(){
 const items=S.cmp.map(byId).filter(Boolean);if(items.length<2)return toast("2개 이상 선택하세요");
 const G=items[0].kind==="drone"?GD:GC;
 const keys=G.flatMap(g=>g.k).filter(k=>items.some(i=>i.sp[k]!=null));
 const head=["항목",...items.map(i=>nm(i))];
 const rows=[["종류",...items.map(i=>i.kind==="drone"?"드론":"안티드론")],
  ["국가",...items.map(i=>cty(i.country).ko)],
  ["신뢰도",...items.map(i=>i.conf)],
  ...keys.map(k=>[lab(k),...items.map(i=>plain(i.sp[k])||"미공개")])];
 dl("gdcal_compare.csv",[head,...rows].map(r=>r.map(csvEsc).join(",")).join("\n"));
}
function pushHist(msg,id){S.hist.unshift({at:new Date().toISOString().slice(0,16).replace("T"," "),msg,id});S.hist=S.hist.slice(0,200);save()}

 document.querySelector(".modal")?.remove();
 const m=el(`<div class="modal"><div class="modal-in">
  <div class="modal-h"><h3>${esc(title)}</h3><button class="iconbtn" data-closemodal="1">✕</button></div>
  <div class="modal-b">${body}</div></div></div>`);
 document.body.appendChild(m);
}

/* ==========================================================================
   이미지 등록 대화상자
   ========================================================================== */
let PENDING=null;   /* {blob,w,h} — 저장 대기 중인 축소 이미지 */
function imgDialog(id,editOnly){
 const it=byId(id);if(!it)return;
 const im=IMG[id],m=(im&&im.meta)||{};
 PENDING=null;
 showModal(`${esc(nm(it))} — 이미지 ${im?(editOnly?"출처 수정":"교체"):"추가"}`,`
  ${editOnly?"":`
  <div class="drop" id="drop">
   <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v13"/></svg>
   <b>이미지 파일을 끌어다 놓거나 클릭해 선택</b>
   <span>JPG · PNG · WebP · 긴 변 1400px로 자동 축소되어 저장됩니다</span>
   <input type="file" id="imgfile" accept="image/*" hidden>
  </div>
  <div id="prevbox"></div>`}
  <div style="margin-top:14px">
   <div class="fld"><label>이미지 종류 *</label><select id="i_kind">
    ${IMGKIND.map(k=>`<option value="${k.id}" ${m.kind===k.id?"selected":""}>${k.ko}</option>`).join("")}</select>
    <div class="hint">실물·잔해·렌더링·프로토타입·양산형을 구분해 기록합니다.</div></div>
   <div class="fld"><label>제공기관 / 촬영자 *</label>
    <input id="i_credit" value="${esc(m.credit||"")}" placeholder="예) 우크라이나 국방부, Baykar, 본인 촬영"></div>
   <div class="fld"><label>출처 URL *</label>
    <input id="i_src" value="${esc(m.src||"")}" placeholder="https://…">
    <div class="hint">공식 제조사·정부·군 기관 자료를 우선 사용하세요.</div></div>
   <div class="fld"><label>사용조건 · 라이선스 *</label><select id="i_lic">
    ${IMGLIC.map(l=>`<option ${m.license===l?"selected":""}>${l}</option>`).join("")}</select></div>
   <div class="fld"><label>비고</label>
    <input id="i_note" value="${esc(m.note||"")}" placeholder="예) 2024년 키이우 전시회 공개분"></div>
   <label class="fopt" style="padding:6px 0"><input type="checkbox" id="i_uncertain" ${m.uncertain?"checked":""}>
    <span>동일 장비 여부가 불확실함 — "이미지 검증 필요"로 표시</span></label>
   <label class="fopt" style="padding:6px 0"><input type="checkbox" id="i_affirm">
    <span>AI 생성 이미지가 아니며, 위 출처에서 확인한 실제 자료입니다. *</span></label>
   <div style="display:flex;gap:6px;margin-top:14px">
    <button class="btn primary" data-imgsave="${id}" data-editonly="${editOnly?1:0}">저장</button>
    <button class="btn" data-closemodal="1">취소</button>
   </div>
   <div class="hint" style="margin-top:8px">* 표시 항목은 필수입니다. 출처 없는 이미지는 등록되지 않습니다.</div>
  </div>`);
 if(editOnly)return;
 const drop=document.getElementById("drop"),fi=document.getElementById("imgfile");
 const handle=async f=>{
  if(!f)return;
  if(!/^image\//.test(f.type))return toast("이미지 파일만 등록할 수 있습니다");
  try{
   PENDING=await shrink(f,1400);
   document.getElementById("prevbox").innerHTML=
    `<div class="preview"><img src="${URL.createObjectURL(PENDING.blob)}" alt="미리보기">
     <div class="pmeta">${PENDING.w}×${PENDING.h}px · ${fmtBytes(PENDING.blob.size)} · 원본 ${esc(f.name.slice(0,40))}</div></div>`;
  }catch(e){toast(e.message||"이미지를 처리할 수 없습니다")}
 };
 drop.addEventListener("click",()=>fi.click());
 fi.addEventListener("change",()=>handle(fi.files[0]));
 ["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("over")}));
 ["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("over")}));
 drop.addEventListener("drop",e=>handle(e.dataTransfer.files[0]));
}
async function imgSave(id,editOnly){
 const g=x=>document.getElementById(x);
 const credit=g("i_credit").value.trim(),src=g("i_src").value.trim();
 if(!credit)return toast("제공기관 또는 촬영자를 입력하세요");
 if(!src)return toast("출처 URL을 입력하세요 — 출처 없는 이미지는 등록하지 않습니다");
 if(!/^https?:\/\/\S+/i.test(src)&&!/^(본인|직접)/.test(src))return toast("출처 URL 형식이 올바르지 않습니다 (http:// 또는 https://)");
 if(!g("i_affirm").checked)return toast("AI 생성 이미지가 아님을 확인해 주세요");
 const old=IMG[id];
 if(!editOnly&&!PENDING&&!old)return toast("이미지 파일을 먼저 선택하세요");
 const meta={kind:g("i_kind").value,credit,src,license:g("i_lic").value,note:g("i_note").value.trim(),
  uncertain:g("i_uncertain").checked,added:new Date().toISOString().slice(0,10),
  dim:PENDING?`${PENDING.w}×${PENDING.h}`:(old&&old.meta.dim)||""};
 let blob=PENDING?PENDING.blob:null;
 if(!blob){ /* 출처만 수정 — 기존 blob을 다시 읽어 온다 */
  try{blob=await fetch(old.url).then(r=>r.blob())}catch(e){return toast("기존 이미지를 읽을 수 없습니다")}
 }
 try{
  await IDB.put({id,blob,meta});
  cacheImg({id,blob,meta});
  pushHist(`이미지 ${old?"교체·수정":"등록"}: ${nm(byId(id))} (${kindName(meta.kind)} / ${meta.credit})`,id);
  PENDING=null;
  document.querySelector(".modal")?.remove();
  rerender();toast("이미지를 저장했습니다");
 }catch(e){
  toast("저장 실패: "+(e.message||"저장 공간이 부족할 수 있습니다"));
 }
}
async function imgDelete(id){
 await IDB.del(id);
 if(IMG[id]&&IMG[id].url)URL.revokeObjectURL(IMG[id].url);
 delete IMG[id];
 pushHist(`이미지 삭제: ${nm(byId(id))}`,id);
 rerender();toast("이미지를 삭제했습니다");
}
/* 이미지 백업 — 데이터 URL로 직렬화 */
async function imgExport(){
 const ids=Object.keys(IMG);
 if(!ids.length)return toast("등록된 이미지가 없습니다");
 const out={};
 for(const id of ids){
  const b=await fetch(IMG[id].url).then(r=>r.blob());
  out[id]={meta:IMG[id].meta,data:await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)})};
 }
 dl("gdcal_images.json",JSON.stringify(out),"application/json");
 toast(`이미지 ${ids.length}건을 내보냈습니다`);
}
function imgImport(){
 const fi=document.createElement("input");fi.type="file";fi.accept="application/json";
 fi.onchange=async()=>{
  const f=fi.files[0];if(!f)return;
  try{
   const o=JSON.parse(await f.text());let n=0;
   for(const id of Object.keys(o)){
    const b=await fetch(o[id].data).then(r=>r.blob());
    await IDB.put({id,blob:b,meta:o[id].meta});cacheImg({id,blob:b,meta:o[id].meta});n++;
   }
   pushHist(`이미지 일괄 복원 ${n}건`);rerender();toast(`이미지 ${n}건을 복원했습니다`);
  }catch(e){toast("파일을 읽을 수 없습니다: "+e.message)}
 };
 fi.click();
}

/* ---------- 관리자 로직 ---------- */
function adminSave(){
 const g=id=>document.getElementById(id);
 const ko=g("a_ko").value.trim();
 if(!ko)return toast("한국어 명칭은 필수입니다");
 const src=g("a_src").value.trim();
 const conf=src?g("a_conf").value:"E";
 if(!src)toast("출처 URL이 없어 신뢰도를 E(미확인)로 고정했습니다");
 const id="u_"+Date.now().toString(36);
 let sid=null;
 if(src){sid="S_USER_"+id;SOURCES[sid]={n:g("a_srcn").value.trim()||"사용자 등록 출처",t:g("a_srcn").value.trim()||ko+" 관련 자료",
   u:src,pub:"—",acc:new Date().toISOString().slice(0,10),tier:4,typ:"사용자 등록",lang:"—"}}
 const sp={};
 if(g("a_mfr").value.trim())sp.mfr=V(g("a_mfr").value.trim(),sid);
 if(g("a_year").value)sp.year=V(g("a_year").value,sid);
 g("a_sp").value.split("\n").forEach(line=>{const i=line.indexOf("=");if(i>0){
  const k=line.slice(0,i).trim(),v=line.slice(i+1).trim();if(k&&v&&v!=="미공개")sp[k]=V(v,sid,src?null:"need")}});
 if(g("a_note").value.trim())sp.note=V(g("a_note").value.trim(),sid);
 const kind=g("a_kind").value;
 const it={id,kind,ko,en:g("a_en").value.trim()||ko,orig:g("a_orig").value.trim()||"",alias:[],
  country:g("a_country").value,mfr:g("a_mfr").value.trim(),year:+g("a_year").value||null,
  status:g("a_status").value,conf,verify:g("a_verify").checked,war:g("a_war").checked,sil:g("a_sil").value,
  mission:[],airframe:[],size:[],prop:[],cSensor:[],cIdent:[],cEffect:[],kill:"detect",
  added:new Date().toISOString().slice(0,10),updated:new Date().toISOString().slice(0,10),
  sp,num:{},an:{missions:"",cases:[],str:[],wk:[],pros:[],cons:[],targets:[],dd:3,rf:3,gnss:3,auto:2,thU:2,thI:2,thM:2,layers:[]}};
 S.user.push(it);save();pushHist(`신규 등록: ${ko} (신뢰도 ${conf}${src?"":", 출처 없음"})`,id);
 toast("등록되었습니다");location.hash="#/item/"+id;
}
function csvImport(){
 const txt=document.getElementById("a_csv").value.trim();
 if(!txt)return toast("CSV 내용을 입력하세요");
 let n=0;
 txt.split("\n").forEach(line=>{
  const c=line.split(",").map(s=>s.trim());
  if(c.length<4||/^kind/i.test(c[0]))return;
  const id="u_"+Math.random().toString(36).slice(2,8);
  const src=c[10]||"";let sid=null;
  if(src){sid="S_USER_"+id;SOURCES[sid]={n:"CSV 일괄 등록 출처",t:c[2]+" 관련 자료",u:src,pub:"—",
   acc:new Date().toISOString().slice(0,10),tier:4,typ:"사용자 등록",lang:"—"}}
  S.user.push({id,kind:c[0]==="cuas"?"cuas":"drone",country:c[1]||"EU",ko:c[2],en:c[3]||c[2],orig:c[4]||"",
   alias:[],mfr:c[5]||"",year:+c[6]||null,status:c[7]||"ops",conf:src?(c[8]||"D"):"E",sil:c[9]||"fixed",
   war:c[11]==="1",verify:c[12]!=="0",mission:[],airframe:[],size:[],prop:[],cSensor:[],cIdent:[],cEffect:[],kill:"detect",
   added:new Date().toISOString().slice(0,10),updated:new Date().toISOString().slice(0,10),
   sp:c[5]?{mfr:V(c[5],sid)}:{},num:{},
   an:{missions:"",cases:[],str:[],wk:[],pros:[],cons:[],targets:[],dd:3,rf:3,gnss:3,auto:2,thU:2,thI:2,thM:2,layers:[]}});
  n++});
 save();pushHist(`CSV 일괄 등록 ${n}건`);toast(`${n}건 등록되었습니다`);rerender();
}

/* ---------- 부트 ----------
   스크립트가 <head>에서 실행되는 경우(문서 조각으로 삽입될 때)에도
   document.body가 준비된 뒤에 시작하도록 방어한다. */
function boot(){
 if(document.getElementById("app"))return;
 seedImages();
 document.body.insertAdjacentHTML("afterbegin",shell());
 applyTheme();
 window.addEventListener("hashchange",route);
 route();
 /* 저장된(로컬 업로드) 이미지를 불러온 뒤 다시 그린다 — 있으면 기본 제공 이미지를 덮어쓴다 */
 loadImages().then(n=>{if(n)rerender()}).catch(()=>{});
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);
else boot();


</script>
